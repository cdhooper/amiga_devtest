name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: stefanreinauer/amiga-gcc:gcc-v13.4

    steps:
      - uses: actions/checkout@v6

      - name: Build devtest
        id: build
        run: |
          make
          make lha
          printf 'archive=%s\n' \
            "$(make -s --no-print-directory print-lha-name)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload LhA archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          archive: false
